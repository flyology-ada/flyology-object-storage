name = "flyology_object_storage"
description = "S3 client and pluggable object-storage server for Flyology"
version = "0.1.0-dev"

authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "MIT OR Apache-2.0"
website = "https://github.com/flyology-ada/flyology-object-storage"
project-files = ["flyology_object_storage.gpr"]
tags = ["ada", "s3", "aws", "object-storage", "client", "server"]

[[depends-on]]
flyology_http = "=0.1.3-dev"

#  Provisional consumer-approved Flyology.HTTP PR #33 baseline. This immutable
#  git pin is required for the composable client API and must be replaced by
#  the reviewed dev-index release after merge; it is never a local path pin.
[[pins]]
flyology_http = { url = "https://github.com/flyology-ada/flyology-http.git", commit = "8a527902148487d8d80af15aa0dac66774c6cc90" }

#  PR #33 carries its not-yet-indexed QUIC dependency in this subcrate at the
#  same reviewed commit, so the provisional graph remains one immutable source.
[[pins]]
flyology_quic = { url = "https://github.com/flyology-ada/flyology-http.git", subdir = "flyology_quic", commit = "8a527902148487d8d80af15aa0dac66774c6cc90" }

[build-switches]
"*".ada_version = "Ada2022"
development.optimization = "Debug"
development.compile_checks = "Errors"
release.optimization = "Performance"
release.compile_checks = "Warnings"

[[actions]]
type = "test"
command = ["./tests/scripts/test.sh"]

[[depends-on]]
xmlada = "^26.0.0"
